<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="《风起向日葵》的余晖花径，一段在黄昏向日葵花海中安静观赏的延续体验。"
    />
    <meta name="theme-color" content="#d99055" />
    <title>余晖花径 · 风起向日葵</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./sunset.css" />
  </head>
  <body>
    <main class="experience sunset-experience">
      <canvas id="sunsetCanvas" aria-label="黄昏向日葵花海与石径场景"></canvas>
      <div class="sunset-grain" aria-hidden="true"></div>
      <div class="sunset-vignette" aria-hidden="true"></div>

      <header class="masthead sunset-masthead">
        <a class="view-back" href="./" aria-label="返回风起向日葵互动花园">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H6" />
            <path d="m10 7-5 5 5 5" />
          </svg>
          <span>返回花园</span>
          <small>Lxx66</small>
        </a>
        <div class="top-actions">
          <span class="music-hint" id="musicHint">
            正在继续播放《Flower Dance》 · 右上角可切换歌曲
          </span>
          <button
            class="icon-button netease-button"
            id="musicButton"
            type="button"
            aria-label="选择网易云音乐"
            aria-controls="musicPanel"
            aria-expanded="false"
            title="网易云音乐"
          >
            <span class="netease-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="7" cy="17" r="2.3" />
                <circle cx="17.5" cy="15" r="2.3" />
                <path d="M9.3 17V6.2l10.5-2.1v11" />
              </svg>
            </span>
          </button>
          <section
            class="music-panel"
            id="musicPanel"
            aria-label="网易云音乐歌曲选择"
            aria-hidden="true"
            inert
          >
            <div class="music-panel__header">
              <div>
                <p class="music-panel__eyebrow">风中的歌</p>
                <h2>网易云音乐</h2>
              </div>
              <span class="music-panel__count">3 首</span>
            </div>
            <div class="track-list" id="trackList" role="radiogroup" aria-label="选择歌曲">
              <button
                class="track-option"
                type="button"
                role="radio"
                aria-checked="false"
                data-song-id="406173"
              >
                <span>
                  <strong class="track-option__title">Flower Dance</strong>
                  <span class="track-option__artist">DJ OKAWARI · 花间律动</span>
                </span>
                <span class="track-option__status">当前</span>
              </button>
              <button
                class="track-option"
                type="button"
                role="radio"
                aria-checked="false"
                data-song-id="417596830"
              >
                <span>
                  <strong class="track-option__title">美好事物</strong>
                  <span class="track-option__artist">房东的猫 · 温柔生长</span>
                </span>
                <span class="track-option__status">当前</span>
              </button>
              <button
                class="track-option"
                type="button"
                role="radio"
                aria-checked="false"
                data-song-id="406232"
              >
                <span>
                  <strong class="track-option__title">Luv Letter</strong>
                  <span class="track-option__artist">DJ OKAWARI · 微风来信</span>
                </span>
                <span class="track-option__status">当前</span>
              </button>
            </div>
            <div class="netease-player" id="neteasePlayer">
              <span class="netease-player__art" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="7" cy="17" r="2.3" />
                  <circle cx="17.5" cy="15" r="2.3" />
                  <path d="M9.3 17V6.2l10.5-2.1v11" />
                </svg>
              </span>
              <div class="netease-player__meta">
                <strong id="currentTrackTitle">Flower Dance</strong>
                <span id="currentTrackArtist">DJ OKAWARI</span>
                <div
                  class="audio-progress"
                  id="audioProgress"
                  role="progressbar"
                  aria-label="歌曲播放进度"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >
                  <span id="audioProgressFill"></span>
                </div>
                <span class="audio-time" id="audioTime">00:00 / 00:00</span>
              </div>
              <button
                class="player-toggle"
                id="playerToggle"
                type="button"
                aria-label="播放音乐"
              >
                <svg class="player-toggle__play" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 6 9 6-9 6V6Z" />
                </svg>
                <svg class="player-toggle__pause" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 6h3v12H8V6Zm5 0h3v12h-3V6Z" />
                </svg>
              </button>
              <audio id="neteaseAudio" preload="auto" autoplay hidden></audio>
            </div>
            <p class="music-provider" id="musicProvider">音源来自网易云音乐</p>
          </section>
        </div>
      </header>

      <section class="sunset-caption" aria-labelledby="sunsetTitle">
        <p>风停之后</p>
        <h1 id="sunsetTitle">余晖花径</h1>
      </section>

      <div
        class="journey-prompt"
        id="journeyPrompt"
        aria-live="polite"
        aria-hidden="true"
      >
        <span id="journeyPromptText"></span>
      </div>

      <aside
        class="sunset-message"
        id="sunsetMessage"
        aria-live="polite"
        aria-hidden="true"
      >
        <p>日落的八分钟，是一天的布洛芬。</p>
        <span>日落只有八分钟，但我会停下来给你看。</span>
      </aside>

      <div class="toast" id="toast" role="status" hidden></div>
    </main>
    <script type="module" src="./js/sunset.js"></script>
  </body>
</html>
